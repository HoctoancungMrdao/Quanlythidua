<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng Kết Thi Đua - THCS-THPT Trần Trường Sinh</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col pb-12">

    <!-- HEADER -->
    <header class="bg-red-700 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-flag text-yellow-300 text-lg"></i>
                <div>
                    <h1 class="font-bold text-sm md:text-base leading-tight uppercase">THCS-THPT TRẦN TRƯỜNG SINH</h1>
                    <p class="text-[11px] text-red-100">Bảng Tổng Kết Thi Đua & Vi Phạm Tuần</p>
                </div>
            </div>
            <span class="px-2.5 py-1 rounded bg-red-800 text-white text-xs font-bold flex items-center gap-1 shadow-sm">
                <i class="fa-solid fa-eye"></i> Công Khai
            </span>
        </div>
    </header>

    <main class="max-w-3xl w-full mx-auto p-3 space-y-4 flex-grow">

        <!-- 1. MỤC CHỌN TUẦN -->
        <section class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-calendar-week text-red-600 text-lg"></i>
                <span class="text-xs md:text-sm font-bold text-slate-700">Xem Thi Đua Theo Tuần:</span>
            </div>
            <select id="weekSelect" onchange="changeWeek()" class="bg-red-50 border border-red-300 font-bold text-xs md:text-sm text-red-700 rounded-lg px-3 py-1.5 focus:outline-none cursor-pointer">
                <option value="Tuần 05">Tuần 05 (05/10 - 09/10)</option>
                <option value="Tuần 06">Tuần 06 (12/10 - 16/10)</option>
                <option value="Tuần 07">Tuần 07 (19/10 - 23/10)</option>
            </select>
        </section>

        <!-- 2. KẾT QUẢ XẾP HẠNG PHÍA TRÊN -->
        <section class="space-y-2">
            <h2 class="font-bold text-xs md:text-sm text-slate-800 uppercase flex items-center gap-2">
                <i class="fa-solid fa-trophy text-amber-500"></i> Bảng Xếp Hạng <span id="lblWeekRank" class="text-red-600">Tuần 05</span>
            </h2>

            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="bg-blue-700 text-white px-3 py-2 font-bold text-xs uppercase">BẢNG XẾP HẠNG TỔNG THỂ</div>
                <div id="rankList" class="divide-y divide-slate-100"></div>
            </div>
        </section>

        <!-- 3. DANH SÁCH LỚP VÀ CHI TIẾT VI PHẠM -->
        <section class="space-y-3 pt-2">
            <h2 class="font-bold text-xs md:text-sm text-slate-800 uppercase flex items-center gap-2">
                <i class="fa-solid fa-list-check text-red-600"></i> Chi Tiết Vi Phạm Theo Lớp
            </h2>

            <div id="classListContainer" class="space-y-3"></div>
        </section>

    </main>

    <script>
        const RULES = {
            1: { text: "Không thuộc bài/điểm kém", pts: -5 },
            2: { text: "Cúp tiết học", pts: -10 },
            3: { text: "Gian lận kiểm tra/thi", pts: -20 },
            11: { text: "Vắng có phép", pts: -1 },
            12: { text: "Vắng không phép", pts: -5 },
            13: { text: "Đến lớp trễ", pts: -5 },
            14: { text: "Mất trật tự trong giờ", pts: -5 },
            15: { text: "Sai đồng phục/phù hiệu", pts: -5 },
            16: { text: "Tô son/sơn móng", pts: -10 },
            17: { text: "Lớp ồn/không nghiêm túc", pts: -20 },
            18: { text: "Để xe sai quy định", pts: -20 },
            19: { text: "Cư xử thiếu văn hóa", pts: -20 },
            20: { text: "Ăn mặc phản cảm/nhuộm tóc", pts: -20 },
            22: { text: "Cúp chào cờ", pts: -20 },
            23: { text: "Vô lễ thầy cô", pts: -20 },
            24: { text: "Dùng ĐTDĐ sai quy định", pts: -20 },
            25: { text: "Vi phạm ATGT/Trật tự", pts: -30 },
            26: { text: "Thiếu khăn lau/bình hoa", pts: -10 },
            27: { text: "Vệ sinh lớp không sạch", pts: -10 },
            28: { text: "Không lau bảng", pts: -10 },
            29: { text: "Mang thức ăn/hộp xốp", pts: -20 },
            30: { text: "Phá hoại tài sản/vẽ bẩn", pts: -20 }
        };

        const SAMPLE_CLASSES = ["10A1", "10A2", "10A3"];

        const CLASS_STUDENTS = {
            "10A1": [
                "Từ Liêu Quốc An", "Nguyễn Quốc Anh", "Trần Gia Bảo", "Nguyễn Lê Thùy Dương", "Phan Trần Phúc Đạt",
                "Bùi Trần Hoàng Giang", "Nguyễn Thị Ngọc Hân", "Hà Huy Hoàng", "Nguyễn Nhựt Huy", "Lê Nguyễn Gia Hưng",
                "Phạm Nhật Khang", "Phạm Huỳnh Như Khánh", "Nguyễn Trần Yến Lam", "Bùi Thị Thùy Lan", "Đỗ Pha Lê",
                "Phan Thành Lợi", "Bùi Thị Trà My", "Nguyễn Thị Bảo Ngân", "Nguyễn Thị Thảo Ngân", "Nguyễn Gia Nghi",
                "Nguyễn Khánh Ngọc", "Võ Thị Khánh Ngọc", "Nguyễn Thị Thảo Nguyên", "Tống Hoài Nhân", "Hồ Phúc Nhân",
                "Lê Ngọc Như", "Nguyễn Tấn Phát", "Nguyễn Ngọc Bảo Quân", "Phan Đỗ Quyên", "Lê Hoàng Sang",
                "Hồ Thị Mỹ Tâm", "Võ Diễm Thi", "Phạm Thị Kim Thùy", "Nguyễn Ngọc Anh Thư", "Hồ Ngọc Bảo Trâm",
                "Nguyễn Trần Huyền Trân", "Đỗ Duy Tường", "Lê Vĩnh Tường", "Phan Như Uyên", "Hồ Quốc Việt",
                "Võ Thị Kha Vy", "Bùi Minh Vy", "Phan Thị Lan Vy", "Nguyễn Trần Như Ý", "Đào Phi Yến"
            ],
            "10A2": [
                "Nguyễn Huỳnh Cẩm Duyên", "Võ Quốc Hào", "Nguyễn Văn Đại Hênh", "Lê Dương Kiến Hoa", "Ka Huê",
                "Đặng Nhật Huy", "Hồ Huỳnh Nhựt Huy", "Nguyễn Quốc Huy", "Triệu Hoàng Linh", "Nguyễn Phú Lộc",
                "Mai Phát Lộc", "Nguyễn Phú Lợi", "Tống Phước Mạnh", "Nguyễn Ái My", "Quang Thị Thúy Ngân",
                "Đặng Hữu Nghĩa", "Phạm Thị Bảo Ngọc", "Phạm Thị Khánh Ngọc", "Huỳnh Thị Thúy Nguyên", "Phan Hoàng Nhân",
                "Nguyễn Trí Nhân", "Lê Phương Nhi", "Trần Huỳnh Hoàng Phi", "Mai Trọng Phúc", "Bùi Mai Quyên",
                "Ngô Thành Tài", "Đoàn Gia Tâm", "Nguyễn Chí Thiện", "Huỳnh Thơ", "Võ Phương Thùy",
                "Nguyễn Minh Thùy", "Phạm Thị Minh Thư", "Nguyễn Anh Thư", "Huỳnh Thị Anh Thư", "Mai Trần Hạ Thy",
                "Nguyễn Thị Ngọc Trầm", "Nguyễn Phú Trọng", "Nguyễn Thị Ngọc Truyết", "Nguyễn Thị Cẩm Tú", "Phạm Thị Mộng Tuyền",
                "Tăng Hà Vi", "Tống Triệu Vĩ", "Ngô Ngọc Vy", "Bùi Thị Tường Vy", "Lê Nguyễn Hà Vy",
                "Trần Thị Tường Vy", "Hồ Ngọc Yến"
            ],
            "10A3": [
                "Hồ Huỳnh Anh", "Đặng Hoàng Duy", "Phạm Thị Phương Hạ", "Đặng Nhật Hào", "Trần Thị Ngọc Hân",
                "Phạm Thị Tú Hân", "Tống Nghi Hân", "Ngô Thị Gia Hân", "Phan Nguyễn Tuấn Huy", "Lưu Hoàng Nhật Huy",
                "Trần Trọng Khang", "Lưu Văn Khuyến", "Phạm Vĩnh Kỳ", "Phạm Thị Tuyết Lê", "Võ Minh Lộc",
                "Lê Văn Lộc", "Nguyễn Thị Diễm My", "Phạm Thị Trà My", "Nguyễn Bảo Ngân", "Nguyễn Hồ Uyên Yến Ngọc",
                "Huỳnh Thị Khánh Ngọc", "Trần Hữu Nhân", "Nguyễn Hữu Nhân", "Ngô Thị Yến Nhi", "Nguyễn Thị Tuyết Như",
                "Huỳnh Trung Nhựt", "Ngô Tấn Phát", "Phạm Minh Phát", "Đồng Nam Phương", "Mai Thị Cẩm Quyên",
                "Trần Minh Tâm", "Huỳnh Thị Thu Tâm", "Lê Nhật Tân", "Lê Khánh Thi", "Nguyễn Thị Như Thì",
                "Huỳnh Nhựt Thiên", "Lê Thị Hoài Thương", "Phạm Minh Toàn", "Lê Nguyễn Hương Trà", "Nguyễn Gia Tuệ",
                "Trương Thiên Tường", "Phạm Thế Vinh", "Ngô Thị Tường Vy", "Chế Trần Tường Vy", "Nguyễn Lê Thảo Vy",
                "Huỳnh Thị Như Ý", "Võ Thị Mỹ Huyền"
            ]
        };

        // DỮ LIỆU VI PHẠM MẪU SẴN DÙNG ĐỂ HIỂN THỊ CÔNG KHAI
        let appState = {
            currentWeek: "Tuần 05",
            data: {
                "Tuần 05": {
                    "10A1": { tiet_tot: 2, tiet_b: 0, tiet_c: 0, tiet_kd: 0, late: false, violations: { "Trần Gia Bảo": "14 15", "Phan Trần Phúc Đạt": "13" } },
                    "10A2": { tiet_tot: 0, tiet_b: 1, tiet_c: 0, tiet_kd: 0, late: false, violations: { "Võ Quốc Hào": "1" } },
                    "10A3": { tiet_tot: 1, tiet_b: 0, tiet_c: 0, tiet_kd: 0, late: false, violations: {} }
                }
            }
        };

        window.onload = function() {
            document.getElementById('weekSelect').value = "Tuần 05";
            renderAll();
        };

        function changeWeek() {
            appState.currentWeek = document.getElementById('weekSelect').value;
            renderAll();
        }

        function renderAll() {
            document.getElementById('lblWeekRank').innerText = appState.currentWeek;
            renderRankings();
            renderClassListWithViolations();
        }

        function calculateClassScore(clsData) {
            if (!clsData) return 100;
            let score = 100;
            score += (clsData.tiet_tot || 0) * 10;
            score -= (clsData.tiet_b || 0) * 3;
            score -= (clsData.tiet_c || 0) * 10;
            score -= (clsData.tiet_kd || 0) * 5;

            if (clsData.violations) {
                Object.values(clsData.violations).forEach(codesStr => {
                    if (codesStr && typeof codesStr === 'string') {
                        codesStr.trim().split(/\s+/).forEach(c => {
                            if (RULES[c]) score += RULES[c].pts;
                        });
                    }
                });
            }
            return score;
        }

        function renderRankings() {
            const weekData = appState.data[appState.currentWeek] || {};

            let list = SAMPLE_CLASSES.map(cls => {
                const info = weekData[cls] || { score: 100, late: false };
                const score = calculateClassScore(info);
                const isPenalized = score < 0 || info.late;
                return { cls, score, late: info.late, isPenalized };
            });

            list.sort((a, b) => {
                if (a.isPenalized && !b.isPenalized) return 1;
                if (!a.isPenalized && b.isPenalized) return -1;
                return b.score - a.score;
            });

            const container = document.getElementById('rankList');
            container.innerHTML = list.map((item, idx) => `
                <div class="px-3 py-2.5 flex items-center justify-between text-xs hover:bg-slate-50">
                    <div class="flex items-center space-x-2">
                        <span class="font-bold text-slate-400 w-4">${idx + 1}</span>
                        <span class="font-bold text-slate-800">Lớp ${item.cls}</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="font-bold ${item.score < 0 ? 'text-red-600' : 'text-blue-700'}">${item.score} điểm</span>
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${item.isPenalized ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}">
                            ${item.late ? 'Trễ SĐB' : item.score < 0 ? 'Điểm Âm' : `Hạng ${idx + 1}`}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        function renderClassListWithViolations() {
            const container = document.getElementById('classListContainer');
            const weekData = appState.data[appState.currentWeek] || {};
            let html = '';

            SAMPLE_CLASSES.forEach(cls => {
                const clsInfo = weekData[cls] || { tiet_tot: 0, tiet_b: 0, tiet_c: 0, tiet_kd: 0, late: false, violations: {} };
                const score = calculateClassScore(clsInfo);
                const students = CLASS_STUDENTS[cls] || [];
                const violationsMap = clsInfo.violations || {};

                let violationRowsHTML = '';
                let hasViolation = false;

                students.forEach(st => {
                    const codes = violationsMap[st];
                    if (codes && typeof codes === 'string' && codes.trim() !== '') {
                        hasViolation = true;
                        const parsedDetails = codes.trim().split(/\s+/).map(c => {
                            return RULES[c] ? `<span class="bg-red-100 text-red-700 font-bold px-1.5 py-0.5 rounded">[Mã ${c}] ${RULES[c].text} (${RULES[c].pts}đ)</span>` : `<span class="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">[Mã ${c}]</span>`;
                        }).join(' ');

                        violationRowsHTML += `
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between text-xs py-1.5 border-b border-slate-100 gap-1">
                                <span class="font-bold text-slate-700"><i class="fa-solid fa-user-xmark text-red-500 mr-1.5"></i>${st}</span>
                                <div class="flex flex-wrap gap-1">${parsedDetails}</div>
                            </div>
                        `;
                    }
                });

                html += `
                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-3.5 space-y-2.5">
                        <div class="flex items-center justify-between border-b pb-2">
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-sm text-slate-800">Lớp ${cls}</span>
                                <span class="text-xs font-bold px-2.5 py-0.5 rounded ${score < 0 ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}">${score} điểm</span>
                                ${clsInfo.late ? '<span class="text-[10px] bg-rose-100 text-rose-700 px-1.5 py-0.5 rounded font-bold">Nộp trễ SĐB</span>' : ''}
                            </div>
                        </div>

                        <div class="space-y-1">
                            <span class="text-[11px] font-bold text-slate-500 uppercase">Danh sách học sinh vi phạm:</span>
                            ${hasViolation ? `<div class="space-y-1 bg-slate-50 p-2.5 rounded-lg border border-slate-100">${violationRowsHTML}</div>` : '<p class="text-xs text-emerald-600 font-medium italic py-1"><i class="fa-solid fa-circle-check mr-1"></i>Không có học sinh vi phạm trong tuần.</p>'}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }
    </script>
</body>
</html>
